spring:
  datasource:
    url: ${RITOMER_DB_TEST_JDBC_URL}
    username: ${RITOMER_DB_TEST_USERNAME}
    password: ${RITOMER_DB_TEST_PASSWORD}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      data-source-properties:
        ApplicationName: ${RITOMER_DB_TEST_APPLICATION_NAME}
        logServerErrorDetail: "false"
        sslmode: "disable"
        gssEncMode: "disable"
  flyway:
    enabled: true
    clean-disabled: true
  sql:
    init:
      mode: never

ritomer:
  security:
    jwt:
      hmac-secret: test-only-jwt-hmac-secret-for-db-tests
  workpapers:
    documents:
      storage:
        backend: LOCAL_FS
        local-root: ${RITOMER_DB_TEST_STORAGE_LOCAL_ROOT}
