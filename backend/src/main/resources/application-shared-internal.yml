# Explicit shared profile. No discovery or Google call occurs at startup.
spring:
  datasource:
    url: ${RITOMER_SHARED_DB_URL}
    username: ${RITOMER_SHARED_DB_USER}
    password: ${RITOMER_SHARED_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 10000
      validation-timeout: 5000
      data-source-properties:
        sslmode: verify-full
        sslrootcert: ${RITOMER_SHARED_DB_CA_PATH}
        connectTimeout: 10
        socketTimeout: 30
        currentSchema: public
  flyway:
    enabled: false # Schema application is a separately authorized operation.
  sql:
    init:
      mode: never
server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: none
  tomcat:
    use-relative-redirects: true
logging:
  level:
    org.springframework.security: WARN
    org.springframework.session: WARN
    org.springframework.web.client: WARN
    org.springframework.jdbc: WARN
    org.postgresql: WARN
    com.zaxxer.hikari: WARN
    org.apache.hc: WARN
    reactor.netty: WARN
ritomer:
  workpapers:
    documents:
      storage:
        backend: GCS
        gcs:
          bucket: ${RITOMER_WORKPAPERS_DOCUMENTS_STORAGE_GCS_BUCKET:}
  security:
    session:
      enabled: true
      absolute-timeout: 8h
    jwt:
      hmac-secret: ""
    shared:
      canonical-origin: ${RITOMER_SHARED_ORIGIN}
      client-id: ${RITOMER_SHARED_OIDC_CLIENT_ID}
      client-secret: ${RITOMER_SHARED_OIDC_CLIENT_SECRET}
      proxy-mode: CLOUD_RUN
      expected-cloud-run-service: ${RITOMER_SHARED_CLOUD_RUN_SERVICE}
      expected-db-host: ${RITOMER_SHARED_DB_HOST:}
      qualification-enabled: ${RITOMER_SHARED_QUALIFICATION_ENABLED:false}
      browser-commitments: ${RITOMER_SHARED_BROWSER_COMMITMENTS:}
      manual-oidc-observation-until: ${RITOMER_SHARED_MANUAL_OIDC_OBSERVATION_UNTIL:}

