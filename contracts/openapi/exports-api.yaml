openapi: 3.1.1
info:
  title: Exports API
  version: 0.1.0
paths:
  /api/closing-folders/{closingFolderId}/export-packs:
    post:
      operationId: createExportPack
      security:
        - cookieSession: []
          csrfToken: []
        - bearerAuth: []
      summary: Generate an immutable audit-ready export pack
      description: >
        Generates a synchronous ZIP snapshot for the closing folder. `Idempotency-Key` is required.
        Replays return the same `exportPackId` only when the persisted logical intention still matches
        the server-side `source_fingerprint`.
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
        - in: path
          name: closingFolderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: First logical generation succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPack"
        "200":
          description: Successful replay returned the already persisted pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPack"
        "400":
          description: Missing, blank or malformed X-Tenant-Id, invalid closingFolderId, or blank Idempotency-Key. Security refusals include INVALID_TENANT_HEADER, AMBIGUOUS_CREDENTIALS (cookie plus bearer), and REQUEST_REJECTED.
        "401":
          description: Authentication required. Includes AUTHENTICATION_REQUIRED and SESSION_EXPIRED; expired sessions are invalidated.
        "403":
          description: Tenant inaccessible or role insufficient. Includes ACCESS_DENIED and ACCESS_REVOKED; global revocation invalidates the session. Unsafe session requests also reject absent, incorrect or stale CSRF with CSRF_REJECTED; legacy bearer requests do not require CSRF.
        "404":
          description: Closing folder absent or outside tenant
        "409":
          description: Predictable business refusal or same key with a different persisted logical intention
    get:
      operationId: listExportPacks
      security:
        - cookieSession: []
        - bearerAuth: []
      summary: List persisted export packs for a closing folder
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: closingFolderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Export packs returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPackList"
        "400":
          description: Missing, blank or malformed X-Tenant-Id, or invalid closingFolderId. Security refusals include INVALID_TENANT_HEADER, AMBIGUOUS_CREDENTIALS (cookie plus bearer), and REQUEST_REJECTED.
        "401":
          description: Authentication required. Includes AUTHENTICATION_REQUIRED and SESSION_EXPIRED; expired sessions are invalidated.
        "403":
          description: Tenant inaccessible or role insufficient. Includes ACCESS_DENIED and ACCESS_REVOKED; global revocation invalidates the session.
        "404":
          description: Closing folder absent or outside tenant
  /api/closing-folders/{closingFolderId}/export-packs/{exportPackId}:
    get:
      operationId: getExportPack
      security:
        - cookieSession: []
        - bearerAuth: []
      summary: Return persisted metadata for an export pack
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: closingFolderId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: exportPackId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Export pack metadata returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPack"
        "400":
          description: Missing, blank or malformed X-Tenant-Id, or invalid UUID path parameters. Security refusals include INVALID_TENANT_HEADER, AMBIGUOUS_CREDENTIALS (cookie plus bearer), and REQUEST_REJECTED.
        "401":
          description: Authentication required. Includes AUTHENTICATION_REQUIRED and SESSION_EXPIRED; expired sessions are invalidated.
        "403":
          description: Tenant inaccessible or role insufficient. Includes ACCESS_DENIED and ACCESS_REVOKED; global revocation invalidates the session.
        "404":
          description: Closing folder absent or outside tenant, or export pack missing
  /api/closing-folders/{closingFolderId}/export-packs/{exportPackId}/content:
    get:
      operationId: downloadExportPack
      security:
        - cookieSession: []
        - bearerAuth: []
      summary: Download the persisted export pack archive through the backend
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: closingFolderId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: exportPackId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Export pack ZIP returned
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, enum: ["private, no-store"] }
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: Missing, blank or malformed X-Tenant-Id, or invalid UUID path parameters. Security refusals include INVALID_TENANT_HEADER, AMBIGUOUS_CREDENTIALS (cookie plus bearer), and REQUEST_REJECTED.
        "401":
          description: Authentication required. Includes AUTHENTICATION_REQUIRED and SESSION_EXPIRED; expired sessions are invalidated.
        "403":
          description: Tenant inaccessible or role insufficient. Includes ACCESS_DENIED and ACCESS_REVOKED; global revocation invalidates the session.
        "404":
          description: Closing folder absent or outside tenant, or export pack missing
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-ritomer-session
      description: Opaque server session; Secure, HttpOnly, Path=/, SameSite=Lax, no Domain.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Current session-bound CSRF token, required only for unsafe cookie-session requests.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Explicit legacy backend compatibility only; never browser authentication. Cannot be combined with the session cookie.
  schemas:
    ExportPackList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExportPack"
    ExportPack:
      type: object
      required:
        - exportPackId
        - closingFolderId
        - fileName
        - mediaType
        - byteSize
        - checksumSha256
        - basisImportVersion
        - basisTaxonomyVersion
        - createdAt
        - createdByUserId
      properties:
        exportPackId: { type: string, format: uuid }
        closingFolderId: { type: string, format: uuid }
        fileName: { type: string }
        mediaType:
          type: string
          enum: [application/zip]
        byteSize: { type: integer, minimum: 1 }
        checksumSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        basisImportVersion: { type: integer, minimum: 1 }
        basisTaxonomyVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        createdByUserId: { type: string, format: uuid }
